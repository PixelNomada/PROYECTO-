name: Compilar DSi IA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Compilar Nintendo DS
    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkitarm:20241104

    steps:

      # --------------------------------------------------
      # 1. Descargar el proyecto
      # --------------------------------------------------
      - name: Descargar proyecto
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Preparar variables de devkitPro
      # --------------------------------------------------
      - name: Preparar entorno devkitPro
        shell: bash
        run: |
          export DEVKITPRO=/opt/devkitpro
          export DEVKITARM=/opt/devkitpro/devkitARM

          echo "DEVKITPRO=$DEVKITPRO"
          echo "DEVKITARM=$DEVKITARM"

          test -d "$DEVKITPRO"
          test -d "$DEVKITARM"
          test -f "$DEVKITARM/ds_rules"

          echo "Entorno devkitARM encontrado."

      # --------------------------------------------------
      # 3. Instalar solamente las dependencias necesarias
      # --------------------------------------------------
      - name: Instalar dependencias Nintendo DS
        shell: bash
        run: |
          echo "Actualizando bases de paquetes..."
          dkp-pacman -Syy --noconfirm

          echo "Instalando libnds..."
          dkp-pacman -S --needed --noconfirm libnds

          echo "Comprobando libnds..."
          test -f /opt/devkitpro/libnds/include/nds.h

          echo "libnds encontrado correctamente."

      # --------------------------------------------------
      # 4. Comprobar compilador
      # --------------------------------------------------
      - name: Comprobar herramientas
        shell: bash
        run: |
          echo "Comprobando arm-none-eabi-g++..."
          command -v arm-none-eabi-g++

          echo "Comprobando ndstool..."
          command -v ndstool

          echo "Comprobando ds_rules..."
          test -f /opt/devkitpro/devkitARM/ds_rules

          echo "Herramientas correctas."

      # --------------------------------------------------
      # 5. Mostrar estructura del proyecto
      # --------------------------------------------------
      - name: Comprobar archivos del proyecto
        shell: bash
        run: |
          echo "=== ARCHIVOS ==="
          find . -maxdepth 3 -type f -print

          echo "=== MAKEFILE ==="
          test -f Makefile

          echo "=== MAIN ==="
          test -f main.cpp || test -f source/main.cpp

      # --------------------------------------------------
      # 6. Compilar
      # --------------------------------------------------
      - name: Compilar DSi IA
        shell: bash
        run: |
          echo "======================================"
          echo "      COMPILANDO DSi IA"
          echo "======================================"

          make V=1

      # --------------------------------------------------
      # 7. Buscar el NDS generado
      # --------------------------------------------------
      - name: Comprobar archivo NDS
        shell: bash
        run: |
          echo "Buscando archivos .nds..."

          find . -type f -name "*.nds" -print

          NDS_FILE=$(find . -type f -name "*.nds" | head -n 1)

          if [ -z "$NDS_FILE" ]; then
            echo "ERROR: no se generó ningún archivo .nds"
            exit 1
          fi

          echo "NDS encontrado:"
          echo "$NDS_FILE"

          cp "$NDS_FILE" DSi-IA.nds

          ls -lh DSi-IA.nds

      # --------------------------------------------------
      # 8. Guardar el NDS como Artifact
      # --------------------------------------------------
      - name: Publicar DSi IA
        uses: actions/upload-artifact@v4
        with:
          name: DSi-IA-NDS
          path: DSi-IA.nds
          if-no-files-found: error
