name: DSi-IA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Compilar DSi-IA
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:20241104

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Instalar dependencias DS
        run: dkp-pacman -Sy --noconfirm nds-dev

      - name: Compilar
        run: make

      - name: Publicar NDS
        uses: actions/upload-artifact@v4
        with:
          name: DSi-IA-NDS
          path: DSi-IA.nds
          if-no-files-found: error
