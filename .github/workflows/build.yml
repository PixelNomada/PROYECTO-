name: Compilar DSi IA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: DSi IA - Nintendo DS
    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkitarm:20241104

    steps:

      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Preparar entorno devkitPro
        shell: bash
        run: |
          export DEVKITPRO=/opt/devkitpro
          export DEVKITARM=/opt/devkitpro/devkitARM
          export PATH="$DEVKITPRO/tools/bin:$DEVKITARM/bin:$PATH"

          echo "DEVKITPRO=$DEVKITPRO"
          echo "DEVKITARM=$DEVKITARM"

          test -d "$DEVKITPRO"
          test -d "$DEVKITARM"
          test -f "$DEVKITARM/ds_rules"

          echo "Entorno devkitPro correcto."

      - name: Comprobar compilador
        shell: bash
        run: |
          export DEVKITPRO=/opt/devkitpro
          export DEVKITARM=/opt/devkitpro/devkitARM
          export PATH="$DEVKITPRO/tools/bin:$DEVKITARM/bin:$PATH"

          test -x "$DEVKITARM/bin/arm-none-eabi-g++"

          "$DEVKITARM/bin/arm-none-eabi-g++" --version

          echo "Compilador ARM encontrado."

      - name: Preparar librerías DS
        shell: bash
        run: |
          export DEVKITPRO=/opt/devkitpro
          export DEVKITARM=/opt/devkitpro/devkitARM
          export PATH="$DEVKITPRO/tools/bin:$DEVKITARM/bin:$PATH"

          echo "Comprobando libnds..."

          if [ ! -f "$DEVKITPRO/libnds/include/nds.h" ]; then
            echo "libnds no está disponible. Instalando libnds..."
            dkp-pacman -Syy --noconfirm
            dkp-pacman -S --needed --noconfirm libnds
          fi

          test -f "$DEVKITPRO/libnds/include/nds.h"

          echo "libnds disponible."

      - name: Comprobar proyecto
        shell: bash
        run: |
          echo "Contenido del proyecto:"
          find . -maxdepth 3 -type f -print

          echo "Comprobando Makefile..."
          test -f Makefile

          echo "Comprobando código..."

          if [ -f main.cpp ]; then
            echo "Encontrado: main.cpp"
          elif [ -f source/main.cpp ]; then
            echo "Encontrado: source/main.cpp"
          else
            echo "ERROR: no se encontró main.cpp"
            exit 1
          fi

      - name: Compilar DSi IA
        shell: bash
        run: |
          export DEVKITPRO=/opt/devkitpro
          export DEVKITARM=/opt/devkitpro/devkitARM
          export PATH="$DEVKITPRO/tools/bin:$DEVKITARM/bin:$PATH"

          echo "========================================"
          echo "          COMPILANDO DSi IA"
          echo "========================================"

          make V=1

      - name: Verificar ROM
        shell: bash
        run: |
          echo "Buscando archivo NDS..."

          find . -type f -name "*.nds" -print

          NDS_FILE=$(find . -type f -name "*.nds" | head -n 1)

          if [ -z "$NDS_FILE" ]; then
            echo "ERROR: MAKE terminó pero no generó ningún .nds"
            exit 1
          fi

          echo "ROM encontrada:"
          echo "$NDS_FILE"

          cp "$NDS_FILE" DSi-IA.nds

          echo "Archivo final:"
          ls -lh DSi-IA.nds

      - name: Publicar DSi IA
        uses: actions/upload-artifact@v4
        with:
          name: DSi-IA-NDS
          path: DSi-IA.nds
          if-no-files-found: error
